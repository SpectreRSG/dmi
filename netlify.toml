# Netlify settings for dmi.codehound.org (Netlify project "directmeasures").
#
# - public/ is served straight from Netlify's CDN: CSS, JavaScript, and the
#   officer timesheet page at /timesheet/.
# - Every other address is handled by the admin app, which runs as one Netlify
#   Function (netlify/functions/app.mjs).
# - The database tables come from netlify/database/migrations/. Netlify applies
#   new migration files automatically on each deploy.
#
# No environment variables are required: the app keeps its own secrets in the
# database (see src/secrets.js). SESSION_SECRET and SETUP_CODE can override them,
# set in the Netlify dashboard (never in this file).

[build]
  publish = "public"
  command = ""
  # Deploys are manual: Netlify builds only when someone pushes to main. Pushes
  # to any other branch (dev, previews) are never built or published.
  ignore = "if [ \"$CONTEXT\" = production ] && [ \"$BRANCH\" = main ]; then exit 1; fi; echo 'Only pushes to main are deployed'; exit 0"

[build.environment]
  NODE_VERSION = "22"

[functions]
  # The app reads its page templates (and, as a fallback, public files) from disk.
  # The two node_modules entries are libraries Netlify's packager doesn't pick up
  # on its own (it takes their newer format; the app loads the older one).
  included_files = ["views/**", "public/**", "assets/**", "node_modules/@netlify/database/**", "node_modules/waddler/**"]

# Headers for files served straight from the CDN. (The admin app sets its own.)
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains"

# The officer timesheet page keeps the same protections it had on its own site.
[[headers]]
  for = "/timesheet/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    # Everything is self-hosted. blob: lets the finished PDF download;
    # data: lets the saved signature image load back into the pad.
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"

[[headers]]
  for = "/timesheet/*.pdf"
  [headers.values]
    Cache-Control = "no-cache"

# The timesheet form's short address (without the final slash) works too.
[[redirects]]
  from = "/timesheet"
  to = "/timesheet/"
  status = 301
